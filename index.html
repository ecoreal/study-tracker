<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="description" content="学习记录 · 番茄钟 · 雅思错题与单词智能复习 · GitHub Gist 同步" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="color-scheme" content="light dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="manifest.json" />
  <title>Study Tracker · 学习面板</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍅%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🍅</span>
        <div>
          <h1 class="brand-title">Study Tracker</h1>
          <p class="brand-sub">学习 · 专注 · 雅思</p>
        </div>
      </div>
      <div class="topbar-right">
        <button type="button" id="sync-status" class="sync-status" title="打开同步设置">未连接</button>
        <button type="button" id="theme-toggle" class="btn btn-ghost btn-icon" aria-label="切换主题" title="切换主题">◐</button>
      </div>
    </header>

    <nav class="nav" id="main-nav" aria-label="主导航">
      <button type="button" class="nav-item active" data-view="dashboard" aria-keyshortcuts="d"><span class="nav-ico" aria-hidden="true">⌂</span><span class="nav-label">今日</span></button>
      <button type="button" class="nav-item" data-view="timer" aria-keyshortcuts="t"><span class="nav-ico" aria-hidden="true">◷</span><span class="nav-label">番茄钟</span></button>
      <button type="button" class="nav-item" data-view="tasks" aria-keyshortcuts="k"><span class="nav-ico" aria-hidden="true">✓</span><span class="nav-label">任务</span></button>
      <button type="button" class="nav-item" data-view="ielts" aria-keyshortcuts="i"><span class="nav-ico" aria-hidden="true">◎</span><span class="nav-label">雅思</span></button>
      <button type="button" class="nav-item" data-view="stats" aria-keyshortcuts="a"><span class="nav-ico" aria-hidden="true">▥</span><span class="nav-label">统计</span></button>
      <button type="button" class="nav-item" data-view="settings" aria-keyshortcuts="s"><span class="nav-ico" aria-hidden="true">⚙</span><span class="nav-label">设置</span></button>
    </nav>

    <main id="view-root" class="view-root">
      <div class="skeleton">
        <div class="skeleton-block" style="height:80px"></div>
        <div class="skeleton-blocks">
          <div class="skeleton-block" style="height:120px"></div>
          <div class="skeleton-block" style="height:120px"></div>
          <div class="skeleton-block" style="height:120px"></div>
          <div class="skeleton-block" style="height:120px"></div>
        </div>
        <div class="skeleton-block" style="height:140px"></div>
      </div>
    </main>

    <div id="mini-bar-root" class="mini-bar-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
  </div>

  <script type="module" src="js/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
