<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="学习记录 · 番茄钟 · 雅思得分 · GitHub Gist 同步" />
  <meta name="theme-color" content="#0f766e" />
  <title>Study Tracker · 学习面板</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍅%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🍅</span>
        <div>
          <h1 class="brand-title">Study Tracker</h1>
          <p class="brand-sub">学习 · 专注 · 雅思</p>
        </div>
      </div>
      <div class="topbar-right">
        <div id="sync-status" class="sync-status" title="同步状态">未连接</div>
        <button type="button" id="theme-toggle" class="btn btn-ghost btn-icon" aria-label="切换主题" title="切换主题">◐</button>
      </div>
    </header>

    <nav class="nav" id="main-nav" aria-label="主导航">
      <button type="button" class="nav-item active" data-view="dashboard">今日</button>
      <button type="button" class="nav-item" data-view="timer">番茄钟</button>
      <button type="button" class="nav-item" data-view="tasks">任务</button>
      <button type="button" class="nav-item" data-view="logs">日志</button>
      <button type="button" class="nav-item" data-view="ielts">雅思</button>
      <button type="button" class="nav-item" data-view="stats">统计</button>
      <button type="button" class="nav-item" data-view="settings">设置</button>
    </nav>

    <main id="view-root" class="view-root"></main>

    <div id="mini-bar-root" class="mini-bar-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
